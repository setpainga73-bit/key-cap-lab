<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Keycap Lab</title>
    <meta
      name="description"
      content="Sign in to your Keycap Lab account to view saved builds and order history."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../dist/output.css" />
    <script src="../JS/cart.js" defer></script>
    <script src="../JS/nav-bar.js" defer></script>
    <script src="../JS/auth.js" defer></script>
  </head>
  <body
    class="bg-bg text-text font-body min-h-screen flex flex-col selection:bg-accent selection:text-on-accent"
  >
    <!-- Navbar -->
    <header
      class="sticky top-0 z-40 w-full bg-bg/95 backdrop-blur-md border-b border-border"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4"
      >
        <div class="flex items-center gap-8">
          <a
            href="../index.html"
            class="flex items-center font-display font-bold text-xl text-text hover:text-accent transition-colors"
          >
            <span>Keycap Lab</span>
          </a>

          <nav
            class="hidden md:flex items-center gap-6"
            aria-label="Desktop Navigation"
          >
            <a
              href="./shop.html"
              class="text-sm font-medium text-muted hover:text-text transition-colors"
              >Shop</a
            >
            <a
              href="./shop.html#bundles"
              class="text-sm font-medium text-muted hover:text-text transition-colors"
              >Bundles</a
            >
            <a
              href="./Builder.html"
              class="text-sm font-medium text-muted hover:text-text transition-colors"
              >Builder</a
            >
          </nav>
        </div>

        <div class="flex items-center gap-3">
          <a
            href="./Cart.html"
            class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-surface border border-border hover:border-accent text-text transition-colors text-sm"
          >
            <i
              class="fa-solid fa-cart-shopping text-accent text-sm"
              aria-hidden="true"
            ></i>
            <span
              class="cart-count inline-flex items-center justify-center px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-accent text-on-accent"
              >0</span
            >
          </a>
        </div>
      </div>
    </header>

    <!-- Main Login Content -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
      <div
        class="w-full max-w-md bg-surface border border-border rounded-2xl p-6 sm:p-8 shadow-2xl flex flex-col gap-6"
      >
        <!-- Header -->
        <div class="text-center flex flex-col items-center gap-2">
          <h1 class="font-display font-bold text-2xl text-text">
            Welcome Back
          </h1>
          <p class="text-xs text-muted max-w-xs">
            Sign in to access your saved custom builds, track your shipments,
            and manage your wishlist.
          </p>
        </div>

        <!-- Error Feedback Banner -->
        <div
          id="login-form-error"
          class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-medium"
          role="alert"
        ></div>

        <!-- Form -->
        <form id="login-form" class="flex flex-col gap-4" novalidate>
          <div class="flex flex-col gap-1.5">
            <label for="login-email" class="text-xs font-semibold text-text"
              >Email Address</label
            >
            <input
              type="email"
              id="login-email"
              name="email"
              required
              placeholder="builder@example.com"
              class="w-full bg-surface-2 border border-border focus:border-accent text-text placeholder:text-muted rounded-xl px-4 py-2.5 text-sm focus:outline-none transition-colors"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label
                for="login-password"
                class="text-xs font-semibold text-text"
                >Password</label
              >
            </div>
            <div class="relative">
              <input
                type="password"
                id="login-password"
                name="password"
                required
                placeholder="••••••••"
                class="w-full bg-surface-2 border border-border focus:border-accent text-text placeholder:text-muted rounded-xl pl-4 pr-10 py-2.5 text-sm focus:outline-none transition-colors font-mono"
              />
              <button
                type="button"
                data-password-toggle="login-password"
                class="absolute right-3 top-3 text-muted hover:text-text cursor-pointer transition-colors"
                aria-label="Toggle password visibility"
              >
                <i class="fa-regular fa-eye text-xs" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="w-full mt-2 inline-flex items-center justify-center gap-2 py-3 rounded-xl font-semibold text-sm bg-accent hover:bg-accent-hover text-on-accent transition-colors cursor-pointer shadow-lg shadow-accent/10"
          >
            <span>Sign In</span>
            <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
          </button>
        </form>

        <!-- Footer link -->
        <div class="text-center text-xs text-muted border-t border-border pt-4">
          <span>Don't have an account?</span>
          <a
            href="./Register.html"
            class="text-accent font-semibold hover:underline ml-1"
            >Create Account</a
          >
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="w-full bg-surface border-t border-border py-6 text-center text-xs text-muted"
    >
      &copy; 2026 Keycap Lab. All rights reserved.
    </footer>
  </body>
</html>
