<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an Account | Keycap Lab</title>
    <meta
      name="description"
      content="Join Keycap Lab to customize and build mechanical keyboards, save setups, and track orders."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../dist/output.css" />
    <script src="../JS/cart.js" defer></script>
    <script src="../JS/nav-bar.js" defer></script>
    <script src="../JS/auth.js" defer></script>
  </head>
  <body
    class="bg-bg text-text font-body min-h-screen flex flex-col selection:bg-accent selection:text-on-accent"
  >
    <header class="w-full border-b border-border">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center">
        <a href="../index.html" class="font-display font-bold text-lg text-text hover:text-accent transition-colors">
          Keycap Lab
        </a>
      </div>
    </header>

    <!-- Main Register Content -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
      <div
        class="w-full max-w-md bg-surface border border-border rounded-2xl p-6 sm:p-8 shadow-2xl flex flex-col gap-6"
      >
        <!-- Header -->
        <div class="text-center flex flex-col items-center gap-2">
          <h1 class="font-display font-bold text-2xl text-text">
            Create an Account
          </h1>
          <p class="text-xs text-muted max-w-xs">
            Join the custom keyboard community to save bespoke builds and manage
            orders.
          </p>
        </div>

        <!-- Error Feedback Banner -->
        <div
          id="register-form-error"
          class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-medium"
          role="alert"
        ></div>

        <!-- Form -->
        <form id="register-form" class="flex flex-col gap-4" novalidate>
          <div class="flex flex-col gap-1.5">
            <label for="register-name" class="text-xs font-semibold text-text"
              >Full Name</label
            >
            <input
              type="text"
              id="register-name"
              name="name"
              required
              placeholder="Alex Morgan"
              class="w-full bg-surface-2 border border-border focus:border-accent text-text placeholder:text-muted rounded-xl px-4 py-2.5 text-sm focus:outline-none transition-colors"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="register-email" class="text-xs font-semibold text-text"
              >Email Address</label
            >
            <input
              type="email"
              id="register-email"
              name="email"
              required
              placeholder="alex@example.com"
              class="w-full bg-surface-2 border border-border focus:border-accent text-text placeholder:text-muted rounded-xl px-4 py-2.5 text-sm focus:outline-none transition-colors"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
              <label
                for="register-password"
                class="text-xs font-semibold text-text"
                >Password</label
              >
              <span class="text-[11px] text-muted"
                >Min 8 chars &amp; 1 number</span
              >
            </div>
            <div class="relative">
              <input
                type="password"
                id="register-password"
                name="password"
                required
                placeholder="••••••••"
                class="w-full bg-surface-2 border border-border focus:border-accent text-text placeholder:text-muted rounded-xl pl-4 pr-10 py-2.5 text-sm focus:outline-none transition-colors font-mono"
              />
              <button
                type="button"
                data-password-toggle="register-password"
                class="absolute right-3 top-3 text-muted hover:text-text cursor-pointer transition-colors"
                aria-label="Toggle password visibility"
              >
                <i class="fa-regular fa-eye text-xs" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              for="register-confirm"
              class="text-xs font-semibold text-text"
              >Confirm Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="register-confirm"
                name="confirm-password"
                required
                placeholder="••••••••"
                class="w-full bg-surface-2 border border-border focus:border-accent text-text placeholder:text-muted rounded-xl pl-4 pr-10 py-2.5 text-sm focus:outline-none transition-colors font-mono"
              />
              <button
                type="button"
                data-password-toggle="register-confirm"
                class="absolute right-3 top-3 text-muted hover:text-text cursor-pointer transition-colors"
                aria-label="Toggle confirm password visibility"
              >
                <i class="fa-regular fa-eye text-xs" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="flex items-start gap-2.5 pt-1">
            <input
              type="checkbox"
              id="register-terms"
              name="terms"
              required
              class="mt-1 accent-accent cursor-pointer"
            />
            <label
              for="register-terms"
              class="text-xs text-muted cursor-pointer leading-relaxed"
            >
              I agree to the Keycap Lab
              <a href="#" class="text-accent underline">Terms of Service</a> and
              <a href="#" class="text-accent underline">Privacy Policy</a>.
            </label>
          </div>

          <button
            type="submit"
            class="w-full mt-2 inline-flex items-center justify-center gap-2 py-3 rounded-xl font-semibold text-sm bg-accent hover:bg-accent-hover text-on-accent transition-colors cursor-pointer shadow-lg shadow-accent/10"
          >
            <span>Create Account</span>
            <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
          </button>
        </form>

        <!-- Footer link -->
        <div class="text-center text-xs text-muted border-t border-border pt-4">
          <span>Already have an account?</span>
          <a
            href="./Login.html"
            class="text-accent font-semibold hover:underline ml-1"
            >Sign in here</a
          >
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="w-full bg-surface border-t border-border py-6 text-center text-xs text-muted"
    >
      &copy; 2026 Keycap Lab. All rights reserved.
    </footer>
  </body>
</html>
